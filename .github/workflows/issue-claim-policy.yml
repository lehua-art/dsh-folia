name: issue-claim-policy

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'PR number to recheck; empty rechecks all open PRs'
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: pr-claim-policy-${{ github.event.pull_request.number || github.event.inputs.pull_number || 'all' }}
  cancel-in-progress: false

jobs:
  policy:
    name: Enforce prior issue approval
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute the external PR's code with this token.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const policy = require('./.github/scripts/issue-claim-policy.cjs');
            const results = await policy.run({ github, context, core });
            core.info(JSON.stringify(results));
