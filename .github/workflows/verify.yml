# Minimal CI for the dsh-folia fork.
#
# The upstream repository shipped a 20 KB verify.yml that ran the whole guard
# suite on a Windows + Ubuntu matrix, routed by a diff classifier. That suite
# asserts the *upstream* shape of the project, which this fork deliberately
# changed:
#
#   - 8 npm packages merged into 1 (lib/components/ instead of packages/)
#   - the About tab emptied (no blurb / star row / credits / QR codes)
#   - upstream community QR codes and the donation code removed
#
# Those guards therefore fail by design, and a red CI on every push is noise
# that hides real breakage. What is still worth gating automatically: the client
# build must succeed and the UI smoke suite must pass.
#
# The rest (lint, typecheck, the structural guards) stays local-only until the
# guard suite is rewritten for the single-package layout.

name: verify

on:
  push:
    branches: [main, folia]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm ci is wrong here: the lockfile predates the package renames, so it
      # disagrees with package.json. npm install regenerates it. Scripts are
      # skipped on purpose — nothing in the dev tree needs a postinstall build,
      # and skipping keeps CI from running arbitrary dependency scripts.
      - name: install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: build the client bundle
        run: node scripts/build-client.mjs

      - name: smoke suite
        run: node test/run-guards.mjs smoke
