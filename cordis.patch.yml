# dsh-plugin-folia bundle patch — single-row form.
#
# This bundle used to contribute EIGHT host rows (the plugin itself plus seven
# subpackage rows: about-notice / mascot-avatar / media-bridge / fonts / fx /
# parallax / pet-link). Those seven now live in this package under
# `lib/components/` and are mounted from `apply()` in `lib/index.js`, so the row
# set is exactly one row: this bundle.
#
# Why the merge (see lib/index.js "BUNDLE-MERGE"): each subpackage browser half
# used to reach the host half through `require('<main package name>')`, which is
# the most fragile edge in the plugin — it broke every time the main package was
# renamed, and an id mismatch silently blanked the font / effect panels. One
# package means no cross-package module id at all.
#
# A patch replaces the targeted row's whole `config`, so only additive `insert`
# rows appear here (we never override an existing shipped row).

- insert:
    - id: folia
      name: 'dsh-folia'
