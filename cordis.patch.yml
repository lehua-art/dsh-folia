# dsh-plugin-folia bundle patch.
#
# ⚠️ 这里**只有一条** row。皮肤中心由桌面端/市场自己那条 row 负责，我们不再插第二条（见下）。
#
# ── 为什么不再声明 skin-center 的 row 与依赖（2026-10-30 实测）─────────────────
# 我们一厢情愿地"随身携带"皮肤中心（`dependencies` + 第二条 insert row），结果与桌面端自己
# 管理的同一条 row 撞了：`.dsh-market/log.ndjson` 每次启动都会写
#
#     "@linxin666/dsh-client-ui-skin-center -> off: fiber=true"
#     "plugin kept off: @linxin666/dsh-client-ui-skin-center"
#
# 也就是**它被关掉了**，于是 `/api/skin-center/v2/*` 整族变成路由 miss（带会话实测：404），
# 「助手皮肤」页签里点「应用」必然失败。把依赖钉到 0.4.8 只在那一次启动里生效，桌面端重启后
# 会把 0.4.12 投影回来（engines 要求 `dsh >= 0.2.1-rc.3`，而当前桌面端是 rc.2）→ 又被关掉。
# 直接改 profile 的 package.json / overrides 会让桌面端"Profile 恢复未完成"进安全模式 —— 那条路
# 我们已经走过一次并回滚，不再重复。
#
# 结论：**不由我们替用户装这个插件**。它该由用户在自己的插件市场/桌面端里装（那里管版本与引擎
# 匹配），我们的页签只做两件事：把站点 zip 解到 `$DSH_HOME/skins`，以及在它确实在跑时写选择。
# 判据见 test/verify-skin-center-bundle.mjs：**只允许一条 row**，且不得再声明为依赖。
#
# A patch replaces the targeted row's whole `config`, so only additive `insert`
# rows appear here (we never override an existing shipped row).

- insert:
    - id: folia
      name: 'dsh-folia'
